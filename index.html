<style>
  :root{
    --bg:#f3efe6; --surface:#fbf9f4; --surface2:#f6f2ea;
    --ink:#221d17; --on-ink:#f7f4ee; --muted:#8a8175; --faint:#b6ad9d; --line:#e7e1d5;
    --accent:#b04e34; --accent-soft:#f1e3db;
    --radius:16px; --shadow:0 8px 30px rgba(60,45,30,.07);
    --serif:"Meiryo","Hiragino Kaku Gothic ProN","Yu Gothic UI",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  }
  html.dark{
    --bg:#191613; --surface:#221e19; --surface2:#26211a;
    --ink:#efe9df; --on-ink:#221e19; --muted:#9c9285; --faint:#5f574c; --line:#332e26;
    --accent:#cc6b4d; --accent-soft:#33231c; --shadow:0 10px 30px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.6; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;}
  .display{font-family:var(--serif); font-weight:600; letter-spacing:-.01em; line-height:1.32;}
  .hl{color:var(--accent);}

  /* header */
  #topbar{display:flex; align-items:center; padding:18px 22px 6px; max-width:640px; margin:0 auto;}
  .brand{font-family:var(--serif); font-size:21px; font-weight:600; cursor:pointer;}
  .brand .dot{color:var(--accent);}
  .spacer{flex:1;}
  body[data-view="study"] #topbar, body[data-view="settings"] #topbar, body[data-view="audio"] #topbar, body[data-view="progress"] #topbar{display:none;}

  .wrap{max-width:640px; margin:0 auto; padding:6px 22px 90px;}
  .view{display:none; animation:fade .25s ease;}
  .view.active{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  /* generic bits */
  .lead{color:var(--muted); font-size:14px; margin:12px 0 0; max-width:34em;}
  .section-label{font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin:28px 0 12px; display:flex; align-items:center; gap:10px;}
  .chip{font-size:11px; font-weight:700; letter-spacing:.07em; padding:3px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-family:var(--sans); white-space:nowrap; background:transparent;}
  button.chip.act{cursor:pointer; transition:.12s;}
  button.chip.act:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
  .chip.due{color:var(--accent); border-color:var(--accent);}
  .chip.solid{background:var(--ink); color:var(--on-ink); border-color:var(--ink);}
  .badge{display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; padding:6px 12px; border-radius:999px; font-family:var(--sans);}
  .badge.accent{background:var(--accent-soft); color:var(--accent);}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
  .center{display:block; margin-left:auto; margin-right:auto; text-align:center;}
  a.link, .linkbtn{color:var(--muted); font-size:13px; cursor:pointer; background:none; border:none; font-family:var(--sans); padding:6px 2px; text-decoration:none;}
  a.link:hover, .linkbtn:hover{color:var(--ink);}
  .empty{text-align:center; color:var(--muted); padding:22px; font-size:14px;}

  /* buttons */
  .btn{font-family:var(--sans); border:1px solid transparent; border-radius:13px; padding:14px 20px; font-size:15px; font-weight:600; cursor:pointer; transition:.15s; display:inline-flex; align-items:center; justify-content:center; gap:8px; line-height:1;}
  .btn:active{transform:translateY(1px);}
  .btn.solid{background:var(--ink); color:var(--on-ink);}
  .btn.solid:hover{opacity:.9;}
  .btn.outline-accent{background:transparent; border-color:var(--accent); color:var(--accent);}
  .btn.outline-accent:hover{background:var(--accent-soft);}
  .btn.ghost{background:var(--surface); border-color:var(--line); color:var(--ink);}
  .btn.ghost:hover{border-color:var(--accent);}
  .btn.ghost.danger{color:var(--accent);}
  .btn.sm{padding:10px 15px; font-size:13px; border-radius:11px;}
  .btn.grow{flex:1;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}

  /* inputs */
  input[type=text],input[type=number],input[type=password],select,.search{background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:11px; padding:11px 13px; font-size:14px; font-family:var(--sans);}
  input:focus,select:focus{outline:none; border-color:var(--accent);}
  .search{width:100%; margin:10px 0 4px;}
  label.fld{display:flex; flex-direction:column; gap:6px; font-size:12px; color:var(--muted); font-weight:600;}

  /* drop zone */
  .drop{display:flex; flex-direction:column; align-items:center; gap:7px; border:1.5px dashed var(--line); border-radius:20px; background:var(--surface); padding:34px 20px; text-align:center; cursor:pointer; transition:.15s; width:100%;}
  .drop:hover,.drop.hover{border-color:var(--accent); background:var(--accent-soft);}
  .drop .ico{width:54px; height:54px; border-radius:15px; border:1.5px solid var(--accent); color:var(--accent); display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:4px;}
  .drop .t{font-weight:700; font-size:15px;}
  .drop .s{color:var(--muted); font-size:13px;}

  /* hero */
  .hero{padding:14px 0 6px;}
  .hero .display{font-size:clamp(30px,8.5vw,42px);}

  /* deck cards */
  .deckcard{display:flex; align-items:center; gap:12px; padding:16px 18px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); margin-bottom:10px; cursor:pointer; transition:.15s;}
  .deckcard:hover{border-color:var(--accent); box-shadow:var(--shadow);}
  .dc-main{flex:1; min-width:0;}
  .dc-name{font-family:var(--serif); font-size:18px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dc-chips{display:flex; gap:7px; margin-top:6px; flex-wrap:wrap;}
  .dc-actions{display:flex; gap:8px; flex:none; align-items:center;}

  /* mapping */
  .tablewrap{overflow:auto; border:1px solid var(--line); border-radius:12px; max-height:230px; margin-top:8px;}
  table{border-collapse:collapse; width:100%; font-size:13px;}
  th,td{border:1px solid var(--line); padding:7px 10px; text-align:left; white-space:nowrap; max-width:230px; overflow:hidden; text-overflow:ellipsis;}
  tr.headrow td{background:var(--accent-soft); font-weight:700; color:var(--accent);}
  .mapgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:14px; margin:16px 0;}
  .extras{display:flex; flex-wrap:wrap; gap:9px;}
  .extras label{display:inline-flex; align-items:center; gap:7px; font-size:13px; background:var(--surface); border:1px solid var(--line); padding:8px 12px; border-radius:10px; cursor:pointer;}
  .badge-warn{background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent); border-radius:10px; padding:9px 13px; font-size:13px; margin-top:12px;}

  /* study */
  .study-wrap{max-width:560px; margin:0 auto; padding:14px 22px 40px; min-height:100vh; display:flex; flex-direction:column;}
  .study-top{display:flex; align-items:center; gap:14px; padding:6px 0 8px;}
  .xbtn{width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--surface); font-size:18px; cursor:pointer; color:var(--ink); line-height:1; flex:none;}
  .xbtn:hover{border-color:var(--accent); color:var(--accent);}
  .progress{flex:1; height:5px; background:var(--line); border-radius:999px; overflow:hidden;}
  .progress>i{display:block; height:100%; background:var(--accent); width:0; transition:width .3s;}
  .count{font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; flex:none;}
  .stage{flex:1; min-height:44vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; position:relative; padding:24px 0;}
  .card-face{width:100%;}
  .word{font-family:var(--serif); font-size:clamp(34px,8.5vw,54px); font-weight:600; letter-spacing:-.01em; line-height:1.12; word-break:break-word;}
  .sub{color:var(--muted); font-size:16px; margin-top:10px;}
  .answer{font-family:var(--serif); color:var(--accent); font-size:clamp(26px,6.5vw,38px); font-weight:600; margin-top:16px; word-break:break-word;}
  .minilabel{font-size:10px; letter-spacing:.16em; color:var(--accent); font-weight:700; margin-bottom:4px;}
  .coreline{margin-top:12px; color:var(--muted); font-size:14px; line-height:1.55; max-width:30em; margin-left:auto; margin-right:auto;}
  .coreline::before{content:"ã‚³ã‚¢ "; color:var(--accent); font-weight:700; font-size:11px; letter-spacing:.08em;}
  .chunkbox{margin-top:18px; display:flex; flex-direction:column; align-items:center; gap:3px;}
  .chunk-en{font-family:var(--serif); font-size:clamp(18px,4.6vw,24px); font-weight:600; line-height:1.25;}
  .chunk-ja{color:var(--muted); font-size:14px;}
  .memo{margin-top:16px; background:var(--surface2); border:1px solid var(--line); border-radius:13px; padding:11px 15px; font-size:14px; color:var(--ink); max-width:30em; margin:16px auto 0; text-align:left;}
  .memo .ml{display:block; font-size:10px; letter-spacing:.16em; color:var(--accent); font-weight:700; margin-bottom:3px;}
  .detailtoggle{margin-top:20px; background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:999px; padding:8px 16px; font-size:13px; font-weight:600; cursor:pointer; font-family:var(--sans);}
  .detailtoggle:hover{border-color:var(--accent); color:var(--accent);}
  #detailBox{width:100%;}
  .detail{color:var(--muted); font-size:15px; margin-top:14px; max-width:30em; margin-left:auto; margin-right:auto;}
  .xtras{margin-top:14px; display:flex; flex-direction:column; gap:3px; color:var(--muted); font-size:13px;}
  .xtras b{color:var(--ink); font-weight:600;}
  .readhint{margin-top:14px; color:var(--faint); font-size:13px; letter-spacing:.03em;}
  .recallask{color:var(--muted); font-size:14px; text-align:center; margin-top:4px;}
  .study-actions{display:flex; gap:12px; align-items:center; margin-top:22px;}
  .circlebtn{width:52px; height:52px; border-radius:50%; border:1px solid var(--line); background:var(--surface); font-size:19px; cursor:pointer; color:var(--ink); flex:none;}
  .circlebtn:hover{border-color:var(--accent); color:var(--accent);}
  .khint{color:var(--faint); font-size:11.5px; text-align:center; margin-top:16px;}
  .khint kbd{background:var(--surface); border:1px solid var(--line); border-radius:5px; padding:1px 6px; font-size:11px; font-family:var(--sans);}
  /* speaking badge + waveform */
  #speakBadge{display:none; position:absolute; top:-6px;}
  body.speaking[data-view="study"] #speakBadge{display:inline-flex;}
  .wave{display:flex; align-items:flex-end; justify-content:center; gap:4px; height:30px; margin:18px auto 0; opacity:.22; transition:opacity .3s;}
  body.speaking .wave{opacity:1;}
  .wave i{width:4px; height:100%; background:var(--accent); border-radius:2px; transform-origin:bottom; transform:scaleY(.28); animation:eq .9s ease-in-out infinite; animation-play-state:paused;}
  body.speaking .wave i{animation-play-state:running;}
  .wave i:nth-child(1){animation-delay:0s;} .wave i:nth-child(2){animation-delay:.1s;}
  .wave i:nth-child(3){animation-delay:.22s;} .wave i:nth-child(4){animation-delay:.34s;}
  .wave i:nth-child(5){animation-delay:.16s;} .wave i:nth-child(6){animation-delay:.06s;} .wave i:nth-child(7){animation-delay:.28s;}
  @keyframes eq{0%,100%{transform:scaleY(.28);}50%{transform:scaleY(1);}}

  /* summary */
  .stats3{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:24px 0;}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 8px; text-align:center;}
  .stat .num{font-family:var(--serif); font-size:30px; font-weight:600; line-height:1;}
  .stat .num.accent{color:var(--accent);}
  .stat .lbl{font-size:12px; color:var(--muted); margin-top:6px;}

  /* word list */
  .wordlist{margin-top:4px;}
  .wl{display:flex; align-items:flex-start; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); cursor:pointer;}
  .wl:hover{background:var(--surface2);}
  .wl .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; margin-top:8px;}
  .wl-main{flex:1; min-width:0;}
  .wl-top{display:flex; align-items:baseline; gap:10px;}
  .wl-en{font-family:var(--serif); font-size:17px;}
  .wl-ja{margin-left:auto; color:var(--muted); font-size:14px; text-align:right; padding-left:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:55%;}
  .wl-stats{font-size:12px; color:var(--muted); margin-top:3px;}
  .wl-stats.faint{color:var(--faint);}
  .wl-stats .bad{color:var(--accent); font-weight:700;}
  .wordlist.compact .wl{padding:10px 4px;}
  .filterbar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:8px 0 12px;}
  .filterbar .flab{color:var(--muted); font-size:12px;}
  .filterbar .flab b{color:var(--ink);}
  .stepper.sm{gap:8px;}
  .stepper.sm button{width:26px; height:26px; font-size:15px; border-radius:8px;}
  .stepinput{width:42px; text-align:center; padding:5px 4px; font-size:14px; font-weight:700; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink); font-family:var(--sans); -moz-appearance:textfield;}
  .stepinput::-webkit-outer-spin-button,.stepinput::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .stepper.sm span{min-width:14px; font-size:14px;}
  .btn.activeseg{background:var(--accent); border-color:var(--accent); color:#fff;}

  /* settings */
  .subtop{display:flex; align-items:center; padding:18px 0 10px;}
  .setlist{margin-top:8px;}
  .setrow{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 0; border-bottom:1px solid var(--line);}
  .setrow:last-child{border-bottom:none;}
  .setrow .lab{font-weight:600; font-size:15px;}
  .setrow .sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .setrow .ctl{flex:none; display:flex; align-items:center; gap:10px;}
  .syncbox{margin:10px 0 20px; padding:16px 18px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);}
