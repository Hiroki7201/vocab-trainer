<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Recall — iPhone初期設定</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f6f4ef}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(520px,100%);background:#fff;border:1px solid #ddd7cc;border-radius:24px;padding:30px;box-shadow:0 18px 50px #0000000d}
    h1{margin:0 0 10px;font-size:28px}p{margin:0;line-height:1.65;color:#67635d}.error{color:#b42318}
    .spinner{width:34px;height:34px;margin:24px 0;border:4px solid #e4e0d7;border-top-color:#171717;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main>
    <h1>Recallを準備中</h1>
    <div class="spinner" id="spinner"></div>
    <p id="status" role="status">Lv60・Lv80の弱点語と学習履歴を読み込んでいます。</p>
  </main>
  <script>
  "use strict";
  const STORE_KEY="vocab_srs_app_v1";
  const status=document.getElementById("status"), spinner=document.getElementById("spinner");
  const fromB64=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/").padEnd(Math.ceil(s.length/4)*4,"=")),c=>c.charCodeAt(0));
  const fail=msg=>{ spinner.style.display="none"; status.className="error"; status.textContent=msg; };
  async function start(){
    try{
      const id=new URLSearchParams(location.search).get("m"), secret=location.hash.slice(1);
      if(!id||!secret) throw new Error("このリンクは不完全です。Codexから届いたリンクをそのまま開いてください。");
      const res=await fetch("./migration/"+encodeURIComponent(id)+".json",{cache:"no-store"});
      if(!res.ok) throw new Error("履歴データを取得できませんでした。");
      const envelope=await res.json();
      const key=await crypto.subtle.importKey("raw",fromB64(secret),"AES-GCM",false,["decrypt"]);
      const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:fromB64(envelope.iv)},key,fromB64(envelope.ct));
      const app=JSON.parse(new TextDecoder().decode(plain));
      const decks=Object.values(app.decks||{}), cards=decks.reduce((n,d)=>n+Object.keys(d.cards||{}).length,0);
      if(decks.length!==2||cards!==278) throw new Error("履歴データの件数を確認できませんでした。");
      let current=null; try{ current=JSON.parse(localStorage.getItem(STORE_KEY)||"null"); }catch(e){}
      if(!current||Number(current.updatedAt||0)<=Number(app.updatedAt||0)) localStorage.setItem(STORE_KEY,JSON.stringify(app));
      localStorage.setItem("recall_iphone_migration_v1",id);
      history.replaceState(null,"","./iphone-import.html");
      spinner.style.display="none"; status.textContent="完了しました。Recallを開きます。";
      setTimeout(()=>location.replace("./?iphone=ready"),500);
    }catch(err){ fail(err&&err.message?err.message:"読み込みに失敗しました。"); }
  }
  start();
  </script>
</body>
</html>
